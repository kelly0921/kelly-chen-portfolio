<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">WriteGuard sandbox demo comparison</title>
  <desc id="desc">A side-by-side sandbox comparison showing ordinary retry producing two external effects while WriteGuard resolves repeated calls into one verified effect.</desc>
  <defs>
    <style>
      .bg{fill:#fbf6eb}.paper{fill:#fffdf8;stroke:#ded2bd;stroke-width:3}.unsafe{fill:#fff0e9;stroke:#d98b67;stroke-width:4}.safe{fill:#e8f7f2;stroke:#2d8c84;stroke-width:4}.dark{fill:#173542}.ink{fill:#173542}.muted{fill:#61747a}.teal{fill:#2d8c84}.rose{fill:#d98b67}.line{fill:none;stroke:#173542;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.bad{fill:none;stroke:#d98b67;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.good{fill:none;stroke:#2d8c84;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.kicker{font:800 22px Inter,Arial,sans-serif;letter-spacing:.11em;text-transform:uppercase}.title{font:850 44px Inter,Arial,sans-serif}.label{font:850 32px Inter,Arial,sans-serif}.body{font:560 24px Inter,Arial,sans-serif}.small{font:720 21px Inter,Arial,sans-serif}.metric{font:900 132px Inter,Arial,sans-serif}.chip{font:820 20px Inter,Arial,sans-serif}
    </style>
  </defs>

  <rect width="1600" height="980" rx="56" class="bg"/>
  <text x="96" y="98" class="kicker teal">Sandbox Demo</text>
  <text x="96" y="158" class="title ink">Same intent. Different external effect count.</text>
  <text x="96" y="204" class="body muted">Duplicate partial refunds make the retry problem visible and easy to verify.</text>

  <g transform="translate(96 284)">
    <rect width="660" height="580" rx="48" class="unsafe"/>
    <text x="54" y="72" class="kicker rose">Without WriteGuard</text>
    <text x="54" y="126" class="label ink">Each retry can act alone</text>

    <g transform="translate(54 184)">
      <rect width="174" height="72" rx="22" class="paper"/>
      <text x="87" y="45" class="chip ink" text-anchor="middle">Call A</text>
      <rect x="0" y="102" width="174" height="72" rx="22" class="paper"/>
      <text x="87" y="147" class="chip ink" text-anchor="middle">Call B</text>
    </g>

    <path d="M240 220 H336" class="bad"/>
    <path d="M240 322 H336" class="bad"/>

    <g transform="translate(360 172)">
      <rect width="226" height="226" rx="42" fill="#fffdf8" stroke="#d98b67" stroke-width="4"/>
      <text x="113" y="98" class="metric rose" text-anchor="middle">2</text>
      <text x="113" y="150" class="label ink" text-anchor="middle">Effects</text>
      <text x="113" y="190" class="small muted" text-anchor="middle">same refund intent</text>
    </g>

    <rect x="54" y="470" width="552" height="68" rx="22" fill="#fffdf8" stroke="#d98b67" stroke-width="3"/>
    <text x="330" y="512" class="body ink" text-anchor="middle">A replay can duplicate the provider action.</text>
  </g>

  <g transform="translate(844 284)">
    <rect width="660" height="580" rx="48" class="safe"/>
    <text x="54" y="72" class="kicker teal">With WriteGuard</text>
    <text x="54" y="126" class="label ink">Retries share one operation</text>

    <g transform="translate(54 194)">
      <rect width="172" height="68" rx="22" class="paper"/>
      <text x="86" y="43" class="chip ink" text-anchor="middle">Call A</text>
      <rect x="0" y="94" width="172" height="68" rx="22" class="paper"/>
      <text x="86" y="137" class="chip ink" text-anchor="middle">Call B</text>
    </g>

    <path d="M226 228 C272 228 278 290 326 290" class="line"/>
    <path d="M226 322 C272 322 278 290 326 290" class="line"/>

    <g transform="translate(326 178)">
      <rect width="268" height="250" rx="42" class="dark"/>
      <text x="134" y="62" class="kicker" fill="#9edbd2" text-anchor="middle">Stable Operation</text>
      <text x="134" y="118" class="label" fill="#fffdf8" text-anchor="middle">1 Effect</text>
      <text x="134" y="170" class="small" fill="#d6eae7" text-anchor="middle">unknown</text>
      <text x="134" y="204" class="small" fill="#d6eae7" text-anchor="middle">then reconciled</text>
    </g>

    <rect x="54" y="470" width="552" height="68" rx="22" fill="#fffdf8" stroke="#2d8c84" stroke-width="3"/>
    <text x="330" y="512" class="body ink" text-anchor="middle">The runtime confirms before acting again.</text>
  </g>
</svg>
