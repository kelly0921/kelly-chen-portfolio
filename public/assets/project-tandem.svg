  </g>
  <g transform="translate(634 388)">
    <rect width="150" height="44" rx="22" fill="#f2efff" stroke="#eadfce"/>
    <text x="75" y="29" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#1f2430">Validation</text>
  </g>
  <g transform="translate(634 450)">
    <rect width="150" height="44" rx="22" fill="#e8faf3" stroke="#eadfce"/>
    <text x="75" y="29" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#1f2430">NYC first</text>
  </g>
