<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Tandem concept card</title>
  <desc id="desc">A minimal Tandem concept card introducing a dating product for complementary ambition.</desc>
  <rect width="960" height="620" rx="36" fill="#fff8ef"/>
  <rect x="96" y="82" width="768" height="456" rx="34" fill="#fffdf9" stroke="#eadfce" stroke-width="2"/>
  <path d="M176 170c58-54 138-54 196 0 58-54 138-54 196 0" fill="none" stroke="#e58aa4" stroke-width="12" stroke-linecap="round"/>
  <text x="176" y="258" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="850" fill="#1f2430">Tandem</text>
  <text x="180" y="314" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#364052">Dating for complementary ambition.</text>
  <path d="M180 348h310" stroke="#e58aa4" stroke-width="8" stroke-linecap="round"/>
  <text x="180" y="408" font-family="Inter, Arial, sans-serif" font-size="21" fill="#606977">A curated NYC dating experiment.</text>
  <text x="180" y="442" font-family="Inter, Arial, sans-serif" font-size="21" fill="#606977">Career, lifestyle, risk, and future fit.</text>
  <g transform="translate(634 326)">
