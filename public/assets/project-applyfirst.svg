    <circle cx="42" cy="44" r="13" fill="#ff8f70"/>
    <circle cx="76" cy="44" r="13" fill="#f9d474"/>
    <circle cx="110" cy="44" r="13" fill="#8ad5c8"/>
    <text x="150" y="39" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff7ea">ApplyFirst</text>
    <text x="150" y="65" font-family="Inter, Arial, sans-serif" font-size="15" fill="#cfe2de">Early-career program monitor</text>
