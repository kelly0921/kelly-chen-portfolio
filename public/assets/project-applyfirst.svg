      <rect x="200" y="184" width="94" height="42" rx="21" fill="#fff7ea" stroke="#ded4c4" stroke-width="2"/>
      <text x="224" y="211">Quant</text>
    </g>

    <g transform="translate(34 270)">
      <rect width="260" height="108" rx="22" fill="#f7f0e8"/>
      <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#252525">Next action</text>
      <text x="24" y="66" font-family="Inter, Arial, sans-serif" font-size="15" fill="#373732">Verify official page, then</text>
      <text x="24" y="90" font-family="Inter, Arial, sans-serif" font-size="15" fill="#373732">prepare resume + short story.</text>
