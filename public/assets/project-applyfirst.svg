      <text x="66" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#252525">Insight program</text>
      <text x="66" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5d615e">High priority · verify now</text>
    </g>

    <g transform="translate(28 218)">
