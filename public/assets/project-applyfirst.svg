  <g transform="translate(826 210)">
    <rect x="0" y="0" width="282" height="424" rx="28" fill="#fffaf2" stroke="#252525" stroke-width="2"/>
    <text x="34" y="54" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#252525">Signal</text>
    <text x="34" y="82" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6b6760">Timing, confidence, readiness</text>

