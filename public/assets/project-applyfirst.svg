<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ApplyFirst opportunity monitor preview</title>
  <desc id="desc">A warm editorial dashboard concept showing program signals, eligibility filters, and opening soon alerts.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ea"/>
      <stop offset="0.55" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eef8f6"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8f70"/>
      <stop offset="1" stop-color="#58b7aa"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#25312f" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="46" fill="#f8efe6"/>
  <rect x="52" y="44" width="1096" height="672" rx="34" fill="url(#paper)" stroke="#252525" stroke-width="3" filter="url(#softShadow)"/>

  <g transform="translate(92 86)">
