      <text x="27" y="43" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff">2</text>
      <text x="66" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#252525">Fellowship track</text>
      <text x="66" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5d615e">Opening window soon</text>
