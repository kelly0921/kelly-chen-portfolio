    <circle cx="140" cy="202" r="92" fill="none" stroke="url(#signal)" stroke-width="18" stroke-linecap="round" stroke-dasharray="390 580" transform="rotate(-90 140 202)"/>
    <circle cx="140" cy="202" r="48" fill="#fffdf8" stroke="#252525" stroke-width="2"/>
    <text x="110" y="197" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#252525">72%</text>
    <text x="97" y="222" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#5d615e">confidence</text>

