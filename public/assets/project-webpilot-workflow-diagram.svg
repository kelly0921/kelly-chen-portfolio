<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">WebPilot website operations workflow</title>
  <desc id="desc">Open-lane storyboard showing how WebPilot turns messy website needs into evidence-backed recommendations, delivery review, and implementation work.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
