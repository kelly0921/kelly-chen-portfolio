        <rect x="42" y="47" width="134" height="88" rx="18" fill="#fffdf8" stroke="#135e65" stroke-width="4"/>
        <path d="M74 31 L80 44 L94 50 L80 56 L74 70 L68 56 L54 50 L68 44 Z" fill="#135e65"/>
        <line x1="68" y1="72" x2="150" y2="72" stroke="#121826" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="96" x2="132" y2="96" stroke="#9edcc8" stroke-width="5" stroke-linecap="round"/>
        <line x1="68" y1="119" x2="143" y2="119" stroke="#5b6ee1" stroke-width="5" stroke-linecap="round"/>
