        <rect x="44" y="44" width="112" height="86" rx="17" fill="#fffdf8" stroke="#135e65" stroke-width="4"/>
        <line x1="64" y1="68" x2="124" y2="68" stroke="#121826" stroke-width="5" stroke-linecap="round"/>
