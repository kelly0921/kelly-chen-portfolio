      <path d="M25 38 L30 34 L35 38 L42 31" stroke="#135e65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44 8 L47 15 L54 18 L47 21 L44 28 L41 21 L34 18 L41 15 Z" fill="#135e65"/>
