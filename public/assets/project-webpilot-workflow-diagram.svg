        <text x="110" y="228" text-anchor="middle" fill="#5d6389" font-size="14" font-weight="650">Human checks before delivery</text>
      </g>

      <g transform="translate(435 88)">
        <circle cx="110" cy="84" r="84" fill="#ffffff" filter="url(#softShadow)"/>
        <rect x="38" y="43" width="124" height="96" rx="18" fill="#fffdf8" stroke="#5b6ee1" stroke-width="4"/>
        <line x1="60" y1="68" x2="136" y2="68" stroke="#121826" stroke-width="5" stroke-linecap="round"/>
        <line x1="60" y1="94" x2="126" y2="94" stroke="#5b6ee1" stroke-width="5" stroke-linecap="round"/>
        <line x1="60" y1="119" x2="112" y2="119" stroke="#9edcc8" stroke-width="5" stroke-linecap="round"/>
        <rect x="166" y="75" width="44" height="34" rx="10" fill="#121826"/>
        <path d="M177 93 L187 103 L200 84" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="110" y="203" text-anchor="middle" fill="#121826" font-size="22" font-weight="850">Client Package</text>
        <text x="110" y="228" text-anchor="middle" fill="#5d6389" font-size="14" font-weight="650">QA, report, requests</text>
      </g>

      <g transform="translate(728 88)">
        <circle cx="110" cy="84" r="84" fill="#ffffff" filter="url(#softShadow)"/>
        <rect x="37" y="50" width="126" height="86" rx="18" fill="#fffdf8" stroke="#5b6ee1" stroke-width="4"/>
        <rect x="57" y="69" width="24" height="16" rx="5" fill="#9edcc8"/>
        <rect x="95" y="69" width="24" height="16" rx="5" fill="#f3c95f"/>
        <rect x="57" y="101" width="72" height="8" rx="4" fill="#121826"/>
        <path d="M164 128 L202 90" stroke="#135e65" stroke-width="7" stroke-linecap="round"/>
        <circle cx="207" cy="84" r="11" fill="#f3c95f"/>
        <text x="110" y="203" text-anchor="middle" fill="#121826" font-size="22" font-weight="850">Implement</text>
        <text x="110" y="228" text-anchor="middle" fill="#5d6389" font-size="14" font-weight="650">Trackable website changes</text>
      </g>

