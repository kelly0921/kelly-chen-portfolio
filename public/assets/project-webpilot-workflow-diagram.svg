      <stop offset="0.55" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="146%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#12393d" flood-opacity="0.12"/>
    </filter>
    <marker id="workArrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#135e65"/>
    </marker>
    <marker id="deliveryArrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#5b6ee1"/>
    </marker>
  </defs>

  <rect width="1200" height="900" rx="34" fill="url(#paper)"/>
  <path d="M78 145 C236 78 372 188 526 112 C686 34 826 156 970 94 C1062 54 1124 86 1150 120" fill="none" stroke="#9edcc8" stroke-width="5" stroke-linecap="round" opacity="0.36"/>
  <path d="M76 748 C228 690 374 780 528 706 C692 628 830 782 972 706 C1064 656 1122 688 1150 722" fill="none" stroke="#c9cdfb" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

