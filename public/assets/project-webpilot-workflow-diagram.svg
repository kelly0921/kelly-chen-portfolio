<svg width="1440" height="820" viewBox="0 0 1440 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WebPilot workflow diagram from client notes to implementation">
  <rect width="1440" height="820" rx="32" fill="#F6F8F7"/>
  <rect x="72" y="64" width="1296" height="692" rx="28" fill="#FFFFFF" stroke="#D9E2DE" stroke-width="2"/>
  <g transform="translate(112 104)">
    <rect width="64" height="64" rx="16" fill="#DDF3EA"/>
    <rect x="15" y="22" width="35" height="28" rx="5" fill="#FFFFFF" stroke="#135E65" stroke-width="3"/>
    <path d="M17 30H49" stroke="#135E65" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 42L35 37L40 42L46 35" stroke="#135E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M49 12L51.8 18.2L58 21L51.8 23.8L49 30L46.2 23.8L40 21L46.2 18.2L49 12Z" fill="#135E65"/>
  </g>
  <text x="196" y="136" fill="#172022" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">WebPilot Workflow</text>
  <text x="196" y="174" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="22">How messy website needs become client-ready recommendations and implementation work</text>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13" stroke="#135E65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(112 278)">
      <rect width="180" height="172" rx="18" fill="#DDF3EA" stroke="#B9DCD1"/>
      <text x="28" y="48" fill="#135E65" font-size="18" font-weight="800">1. Intake</text>
      <text x="28" y="82" fill="#172022" font-size="17" font-weight="700">Client notes</text>
      <text x="28" y="110" fill="#475569" font-size="15">Goals, pain points,</text>
      <text x="28" y="132" fill="#475569" font-size="15">requested changes,</text>
      <text x="28" y="154" fill="#475569" font-size="15">missing assets</text>
    </g>

    <path d="M310 364H390" stroke="#135E65" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(408 278)">
      <rect width="180" height="172" rx="18" fill="#FFFFFF" stroke="#D9E2DE" stroke-width="2"/>
      <text x="28" y="48" fill="#135E65" font-size="18" font-weight="800">2. Evidence</text>
      <text x="28" y="82" fill="#172022" font-size="17" font-weight="700">Website context</text>
      <text x="28" y="110" fill="#475569" font-size="15">Page captures, copy,</text>
      <text x="28" y="132" fill="#475569" font-size="15">PageSpeed, notes,</text>
      <text x="28" y="154" fill="#475569" font-size="15">manual observations</text>
    </g>

    <path d="M606 364H686" stroke="#135E65" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(704 278)">
      <rect width="180" height="172" rx="18" fill="#FFFFFF" stroke="#D9E2DE" stroke-width="2"/>
      <text x="28" y="48" fill="#135E65" font-size="18" font-weight="800">3. AI Output</text>
      <text x="28" y="82" fill="#172022" font-size="17" font-weight="700">Recommendations</text>
      <text x="28" y="110" fill="#475569" font-size="15">Audits, page copy,</text>
      <text x="28" y="132" fill="#475569" font-size="15">SEO, accessibility,</text>
      <text x="28" y="154" fill="#475569" font-size="15">WordPress notes</text>
    </g>

    <path d="M902 364H982" stroke="#135E65" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(1000 278)">
      <rect width="180" height="172" rx="18" fill="#FFFFFF" stroke="#D9E2DE" stroke-width="2"/>
      <text x="28" y="48" fill="#135E65" font-size="18" font-weight="800">4. Delivery</text>
      <text x="28" y="82" fill="#172022" font-size="17" font-weight="700">Client package</text>
      <text x="28" y="110" fill="#475569" font-size="15">Readiness checks,</text>
      <text x="28" y="132" fill="#475569" font-size="15">final QA, report,</text>
      <text x="28" y="154" fill="#475569" font-size="15">copy/export flow</text>
    </g>

    <path d="M1180 364C1268 364 1268 566 1180 566H346" stroke="#135E65" stroke-width="4" marker-end="url(#arrow)" fill="none"/>

    <g transform="translate(408 516)">
      <rect width="292" height="132" rx="18" fill="#DDF3EA" stroke="#B9DCD1"/>
      <text x="28" y="46" fill="#135E65" font-size="18" font-weight="800">5. Implementation Plan</text>
      <text x="28" y="80" fill="#172022" font-size="17" font-weight="700">Trackable website changes</text>
      <text x="28" y="108" fill="#475569" font-size="15">Priority, status, WordPress action, acceptance criteria</text>
    </g>

    <path d="M720 582H800" stroke="#135E65" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(820 516)">
      <rect width="292" height="132" rx="18" fill="#FFFFFF" stroke="#D9E2DE" stroke-width="2"/>
      <text x="28" y="46" fill="#135E65" font-size="18" font-weight="800">6. Client Follow-Up</text>
      <text x="28" y="80" fill="#172022" font-size="17" font-weight="700">Requests and approvals</text>
      <text x="28" y="108" fill="#475569" font-size="15">Photos, bios, reviews, missing copy, final decisions</text>
    </g>
